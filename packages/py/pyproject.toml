[tool.poetry]
name = "ryskV12"
version = "5.3.0"
description = "Python sdk to interact with Rysk v12"
authors = ["thundering-silence <jack@rysk.finance>"]
license = "MIT"
readme = "README.md"
homepage = "https://rysk.finance"
repository = "https://github.com/rysk-finance/sdks"
packages = [{include = "ryskV12"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]

[tool.poetry.urls]
Issues = "https://github.com/rysk-finance/sdks/issues"
"CLI Download" = "https://github.com/rysk-finance/sdks/releases"

[tool.poetry.dependencies]
python = "^3.11"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
