[package]
name = "ryskv12"
version = "4.0.0"
edition = "2021"
rust-version = "1.74"
description = "Rust sdk to interact with Rysk v12"
license = "MIT"
readme = "README.md"
homepage = "https://rysk.finance"
repository = "https://github.com/rysk-finance/sdks"
keywords = ["rysk", "options", "defi", "rfq"]
categories = ["api-bindings"]
include = ["src/**", "scripts/**", "README.md", "LICENSE"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
