name: Release Rust SDK

on:
  workflow_dispatch:

permissions:
  contents: write
  # trusted publishing: crates.io verifies this workflow's oidc token instead
  # of a long lived api token.
  id-token: write

jobs:
  release_and_publish:
    runs-on: ubuntu-latest
    environment: crates-io
    defaults:
      run:
        working-directory: packages/rs
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Get current version
        id: v
        run: echo "version=$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -n 1)" >> "$GITHUB_OUTPUT"

      - name: Refuse to republish a version
        run: |
          if git rev-parse -q --verify "refs/tags/rs-v${{ steps.v.outputs.version }}" >/dev/null; then
            echo "::error::rs-v${{ steps.v.outputs.version }} is already released; bump Cargo.toml first."
            exit 1
          fi

      - name: Require a published CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          min=$(sed -n 's/^const MIN_CLI_VERSION: (u64, u64, u64) = (\([0-9]*\), \([0-9]*\), \([0-9]*\));/\1.\2.\3/p' src/client.rs)
          [ -n "$min" ] || { echo "::error::could not read MIN_CLI_VERSION from src/client.rs"; exit 1; }
          "$GITHUB_WORKSPACE/scripts/require-cli.sh" "$min" "${{ github.repository }}"

      - name: Test
        run: cargo test --locked

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rs-v${{ steps.v.outputs.version }}
          name: Rust SDK v${{ steps.v.outputs.version }}
          target_commitish: main

      # Exchanges this job's oidc token for a short lived crates.io token. The
      # trusted publisher on crates.io must name this repo, this workflow file
      # and the crates-io environment. crates.io only allows that on a crate
      # that exists, so the first publish falls back to a CARGO_REGISTRY_TOKEN
      # secret on the crates-io environment; delete the secret once the
      # trusted publisher is set up.
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
        continue-on-error: true

      - name: Publish to crates.io
        run: |
          [ -n "$CARGO_REGISTRY_TOKEN" ] || { echo "::error::no trusted publisher and no CARGO_REGISTRY_TOKEN secret"; exit 1; }
          cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
