name: Check version bump

# No paths filter on purpose: this is a required status check, and a check that
# never runs blocks the pr forever. The job detects the changed package itself
# and passes trivially when neither sdk was touched.
on:
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: ts
            path: packages/ts
          - package: py
            path: packages/py
          - package: rs
            path: packages/rs
          - package: cpp
            path: packages/cpp
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changes in ${{ matrix.path }}
        id: changed
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          if git diff --quiet "origin/${{ github.base_ref }}...HEAD" -- "${{ matrix.path }}"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Compare versions
        if: steps.changed.outputs.changed == 'true'
        run: |
          read_version() {
            case "${{ matrix.package }}" in
              ts) jq -r .version ;;
              py|rs) sed -n 's/^version *= *"\(.*\)"/\1/p' | head -n 1 ;;
              # cmake_minimum_required's VERSION is not at the start of a line
              cpp) sed -n 's/^ *VERSION \([0-9][^ )]*\).*/\1/p' | head -n 1 ;;
            esac
          }
          case "${{ matrix.package }}" in
            ts) manifest="${{ matrix.path }}/package.json" ;;
            py) manifest="${{ matrix.path }}/pyproject.toml" ;;
            rs) manifest="${{ matrix.path }}/Cargo.toml" ;;
            cpp) manifest="${{ matrix.path }}/CMakeLists.txt" ;;
          esac

          base=$(git show "origin/${{ github.base_ref }}:$manifest" | read_version)
          pr=$(read_version < "$manifest")
          echo "base=$base pr=$pr"

          if [ "$base" = "$pr" ]; then
            echo "::error::$manifest version not bumped ($base)."
            exit 1
          fi
          newest=$(printf '%s\n%s\n' "$base" "$pr" | sort -V | tail -n 1)
          if [ "$newest" != "$pr" ]; then
            echo "::error::$manifest version $pr is older than base $base."
            exit 1
          fi
          echo "Version bumped: $base -> $pr"
