name: Release Python SDK

on:
  workflow_dispatch:

permissions:
  contents: write
  # trusted publishing: the registry verifies this workflow's oidc
  # token instead of a long lived api token.
  id-token: write

jobs:
  release_and_publish:
    runs-on: ubuntu-latest
    environment: pypi
    defaults:
      run:
        working-directory: packages/py
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install poetry
        run: pipx install poetry

      - name: Get current version
        id: v
        run: echo "version=$(poetry version --short)" >> "$GITHUB_OUTPUT"

      - name: Refuse to republish a version
        run: |
          if git rev-parse -q --verify "refs/tags/py-v${{ steps.v.outputs.version }}" >/dev/null; then
            echo "::error::py-v${{ steps.v.outputs.version }} is already released; bump pyproject.toml first."
            exit 1
          fi

      - name: Require a published CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          min=$(sed -n 's/.*_min_sdk_version: str = "\(.*\)".*/\1/p' ryskV12/client.py | head -n 1)
          [ -n "$min" ] || { echo "::error::could not read the minimum cli version from ryskV12/client.py"; exit 1; }
          "$GITHUB_WORKSPACE/scripts/require-cli.sh" "$min" "${{ github.repository }}"

      - name: Build package
        run: poetry build

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: py-v${{ steps.v.outputs.version }}
          name: Python SDK v${{ steps.v.outputs.version }}
          target_commitish: main

      # No user/password: the action exchanges this job's oidc token for a
      # short lived pypi credential. The trusted publisher on pypi must name
      # this repo, this workflow file, and the pypi environment below.
      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/py/dist
