name: Release TS SDK

on:
  workflow_dispatch:

permissions:
  contents: write
  # trusted publishing: the registry verifies this workflow's oidc
  # token instead of a long lived api token.
  id-token: write

jobs:
  release_and_publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/ts
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          registry-url: "https://registry.npmjs.org"

      # trusted publishing landed in npm 11.5.1; the lts node line still ships
      # an older npm, so the bundled one cannot exchange the oidc token.
      - name: Use an npm that can publish with oidc
        run: npm install -g npm@latest

      - name: Get current version
        id: v
        run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - name: Refuse to republish a version
        run: |
          if git rev-parse -q --verify "refs/tags/ts-v${{ steps.v.outputs.version }}" >/dev/null; then
            echo "::error::ts-v${{ steps.v.outputs.version }} is already released; bump package.json first."
            exit 1
          fi

      - name: Require a published CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          min=$(sed -n 's/.*_minSdkVersion: string = "\(.*\)".*/\1/p' src/index.ts | head -n 1)
          [ -n "$min" ] || { echo "::error::could not read the minimum cli version from src/index.ts"; exit 1; }
          "$GITHUB_WORKSPACE/scripts/require-cli.sh" "$min" "${{ github.repository }}"

      - name: Install and build
        run: |
          yarn install --frozen-lockfile --ignore-scripts
          yarn build

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ts-v${{ steps.v.outputs.version }}
          name: TS SDK v${{ steps.v.outputs.version }}
          target_commitish: main

      # No NODE_AUTH_TOKEN: npm mints a short lived credential from the oidc
      # token, and attaches a provenance attestation while it is at it.
      - name: Publish to NPM
        run: npm publish --access public
